services:
  mongo:
    image: mongo:7
    container_name: carexpress-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: carexpress-api
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - ./api/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/carexpress
    ports:
      - "4000:4000"
    volumes:
      - ./api:/app
      - /app/node_modules

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: carexpress-web
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - ./web/.env
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next

volumes:
  mongo_data:
